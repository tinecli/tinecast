name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Package app (ad-hoc signed)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - run: brew install xcodegen

      - name: Swift tests
        run: swift test --package-path Packages/TineCastKit

      - name: Package
        run: TINECAST_SIGN_ID="-" bash scripts/package.sh

      - name: Verify bundle
        run: |
          set -euo pipefail
          test -x dist/TineCast.app/Contents/MacOS/tinecast
          test -f dist/TineCast.app/Contents/Resources/AppIcon.icns
          test "$(lipo -archs dist/TineCast.app/Contents/MacOS/tinecast)" = "arm64"
